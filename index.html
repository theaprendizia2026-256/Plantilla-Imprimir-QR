<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla QR - Generador de Impresión</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

    <!-- Estilo local -->
    <link rel="stylesheet" href="style.css">

    <!-- Librerías CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <!-- Panel de Control Operador -->
    <aside class="control-panel">
        <h2>Configuración</h2>
        
        <div class="form-group">
            <label for="in-title">Título / Nombre</label>
            <input type="text" id="in-title" placeholder="Ej: GERARDO JARA">
        </div>

        <div class="form-group">
            <label for="in-subtitle">Subtítulo / Profesión</label>
            <input type="text" id="in-subtitle" placeholder="Ej: DIBUJANTE">
        </div>

        <div class="form-group">
            <label for="in-url">URL Destino (QR)</label>
            <input type="text" id="in-url" placeholder="https://instagram.com" value="https://instagram.com">
        </div>

        <div class="form-group">
            <label for="in-quote">Frase de Cierre</label>
            <input type="text" id="in-quote" placeholder="Ej: Dibujo al grafito: volumen, textura y realismo...">
        </div>

        <div class="form-group">
            <label for="in-logo">Logo Central (Opcional)</label>
            <input type="file" id="in-logo" accept="image/*">
        </div>
        <!-- Módulo 1: Tono de Papel Canson -->
        <div class="form-group">
            <label for="in-paper-color">Tono de Papel (Textura Canson)</label>
            <select id="in-paper-color">
                <option value="#f7f5f0">Crema Marfil (Clásico)</option>
                <option value="#ffffff">Blanco Puro / Técnico</option>
                <option value="#e8e4d9">Gris Cálido / Texturado</option>
                <option value="#f0eae1">Arena Suave</option>
            </select>
        </div>

        <!-- Módulo 2: Tamaño de PDF con Personalizado -->
        <div class="form-group">
            <label for="in-size">Tamaño de Salida (PDF)</label>
            <select id="in-size">
                <option value="10">10 x 10 cm (Estándar)</option>
                <option value="15">15 x 15 cm (Mediano)</option>
                <option value="20">20 x 20 cm (Grande)</option>
                <option value="custom">Personalizado...</option>
            </select>
        </div>

        <div class="form-group" id="group-custom-size" style="display: none;">
            <label for="in-custom-cm">Medida Personalizada (cm)</label>
            <input type="number" id="in-custom-cm" placeholder="Ej: 12.5" min="5" max="50" step="0.5" value="12">
        </div>

        <!-- Módulo 3: WhatsApp Opcional con nota aclaratoria -->
        <div class="form-group">
            <label for="in-phone">WhatsApp Cliente (Opcional)</label>
            <input type="text" id="in-phone" placeholder="Ej: 56912345678">
            <small class="help-text">Opcional. Permite abrir un chat directo con el PDF listo.</small>
        </div>

        <div class="btn-group">
            <button id="btn-pdf" class="btn-pdf">Descargar PDF para Imprenta</button>
            <button id="btn-ws" class="btn-ws">Enviar por WhatsApp</button>
        </div>
    </aside>

    <!-- Vista Previa Canvas -->
    <main class="preview-container">
        <div class="frame-canvas" id="card-node">
            <header class="header-block">
                <h1 class="header-title" id="out-title">TÍTULO / NOMBRE</h1>
                <p class="header-subtitle" id="out-subtitle">SUBTÍTULO / PROFESIÓN</p>
            </header>

            <section class="qr-block">
               <div class="qr-wrapper" style="position: relative; display: inline-block;">
                  <div id="qr-code"></div>
                  <div id="qr-logo-container" class="qr-logo-overlay" style="display: none;">
                     <img id="qr-logo-img" src="" alt="Logo QR">
                  </div>
                </div>
              <p class="qr-instruction">Escanear QR</p>
           </section>

            <footer class="footer-block">
                <p class="footer-quote" id="out-quote">"Frase de cierre o instrucción..."</p>
            </footer>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
