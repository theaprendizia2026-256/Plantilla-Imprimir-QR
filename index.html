<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla QR 10x10 - Gerardo Jara</title>
    <!-- Fuentes elegantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <!-- Vinculación a hoja de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="frame-canvas">
        <!-- Encabezado -->
        <div class="header-block">
            <h1 class="header-title">GERARDO JARA</h1>
            <p class="header-subtitle">DIBUJANTE</p>
        </div>

        <!-- Código QR -->
        <div class="qr-block">
            <div class="qr-wrapper">
                <img src="https://res.cloudinary.com/deqk2tmer/image/upload/v1785710299/QR_r21oty.png" alt="Código QR">
            </div>
            <p class="qr-instruction">Escanear QR</p>
        </div>

        <!-- Pie de página elevado del borde -->
        <div class="footer-block">
            <p class="footer-quote">"Dibujo al grafito: volumen, textura y realismo en cada detalle."</p>
        </div>
    </div>

</body>
</html>
